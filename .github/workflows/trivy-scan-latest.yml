name: Monthly Trivy Scan (Latest Image)

on:
  workflow_dispatch: {}
  schedule:
    - cron: '23 2 11 * *' # Runs at 02:23 on the 11th of every month

jobs:
  trivy-scan-latest:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Trivy
        uses: aquasecurity/trivy-action@0.34.0
        with:
          scan-type: 'image'
          image-ref: 'ghcr.io/intruder1912/admin-image-ubuntu:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM'
