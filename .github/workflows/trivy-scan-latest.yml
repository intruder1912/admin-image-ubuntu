name: Monthly Trivy Scan (Latest Image)

# Results are kept as workflow artifacts (not as public issues): download the
# "trivy-report" artifact from the run summary.
permissions:
  contents: read
  packages: read

on:
  workflow_dispatch: {}
  schedule:
    - cron: '23 2 11 * *' # Runs at 02:23 on the 11th of every month

jobs:
  trivy-scan-latest:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}:latest # only scan the "latest" tag of the image
    steps:
      - name: Cache Trivy database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ hashFiles('**/trivy-scan-latest.yml') }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

      - name: Run Trivy vulnerability scan - Full report (but no CI fail)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          # produce a machine-readable report including HIGH and CRITICAL, do NOT set exit-code here
          format: 'json'
          vuln-type: 'os,library'
          output: 'trivy-report.json'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scan - Readable report (fixable findings)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: 'table'
          vuln-type: 'os,library'
          ignore-unfixed: true
          output: 'trivy-scan-report.txt'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-report # can be found in the "Artifacts" section of the workflow run summary
          path: |
            trivy-report.json
            trivy-scan-report.txt
          retention-days: 30
          if-no-files-found: error

      # only the count goes into the (publicly visible) run summary, the details stay in the artifact
      - name: Summarise findings
        run: |
          count=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-report.json)
          echo "Trivy found ${count} CRITICAL/HIGH finding(s) in \`${IMAGE_NAME}\`. Download the \`trivy-report\` artifact for details." >> "$GITHUB_STEP_SUMMARY"
