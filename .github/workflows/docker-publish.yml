name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  schedule:
    - cron: '24 0 2 * *'
  push:
    branches: [ "main" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}


jobs:
  build:

    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build-and-push.outputs.digest }}
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        #uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 #v3.5.0
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 #v4.1.2

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
            latest

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # don't upload the build record as a ".dockerbuild" artifact on every run
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          # PRs hand the single amd64 build to the Trivy job as a tarball instead of
          # building it a second time there
          outputs: ${{ github.event_name == 'pull_request' && 'type=docker,dest=/tmp/image.tar' || '' }}
          # PRs only validate the build on amd64 (arm64 runs under QEMU and is the
          # slowest part); main, tags and the schedule build both platforms.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ github.event_name == 'pull_request' && format('{0}/{1}:scan', env.REGISTRY, env.IMAGE_NAME) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          # one explicit scope shared by every event; `ignore-error` keeps a cache
          # service hiccup or a full quota from failing the build or publish
          cache-from: type=gha,scope=build
          # the scheduled run exists to pick up fresh packages: bypass the cached
          # `apt-get upgrade` layer and re-pull base images
          no-cache: ${{ github.event_name == 'schedule' }}
          pull: ${{ github.event_name == 'schedule' }}
          # PRs read the cache but don't write it, to stay within the 10 GB repo quota
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=build,mode=max,ignore-error=true' || '' }}

      # Sign the resulting Docker image digest except on PRs.
      # Keyless signing records the signature in the public Rekor transparency log,
      # which makes the image name and digest public; the "verify the image"
      # section of the README relies on it.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes "{}@${DIGEST}"

      - name: Upload image for the Trivy scan
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image
          path: /tmp/image.tar
          retention-days: 1
          if-no-files-found: error

  # Scans the image the build job produced instead of rebuilding it: the tarball on
  # PRs, the pushed digest everywhere else. The job name is a required status check.
  trivy-scan:
    name: Trivy Scan
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Download image
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: image
          path: /tmp

      - name: Load image
        if: ${{ github.event_name == 'pull_request' }}
        run: docker load --input /tmp/image.tar

      - name: Log into registry ${{ env.REGISTRY }}
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select image to scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            echo "IMAGE_REF=${REGISTRY}/${IMAGE_NAME}:scan" >> "${GITHUB_ENV}"
          else
            echo "IMAGE_REF=${REGISTRY}/${IMAGE_NAME}@${DIGEST}" >> "${GITHUB_ENV}"
          fi

      - name: Run Trivy vulnerability scan - Full report (but no CI fail)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # corresponds to v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          # produce a machine-readable report including HIGH and CRITICAL, do NOT set exit-code here
          format: 'json'
          vuln-type: 'os,library'
          output: 'trivy-report.json'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy JSON report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-report
          path: trivy-report.json
          # the CVE list is only needed to look into a failing scan; artifacts of a public repo are downloadable by any signed-in user
          retention-days: 7
          if-no-files-found: error

      - name: Run Trivy vulnerability scan - Fail on CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # corresponds to v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: 'table'
          ignore-unfixed: true
          exit-code: '1'
          vuln-type: 'os,library'
          severity: 'CRITICAL'
