name: Trivy Container Scan

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  trivy-scan:
    name: Trivy Scan
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Check if Dockerfile exists
        run: |
          if [ ! -f Dockerfile ]; then
            echo "ERROR: Dockerfile not found in repository root."
            exit 1
          fi
      
      # Buildx (instead of plain `docker build`) so the scan can reuse the layer
      # cache populated by the Docker publish workflow (read-only, no cache-to).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build an image from Dockerfile
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
      
      - name: Run Trivy vulnerability scan - Full report (but no CI fail)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # corresponds to v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          # produce a machine-readable report including HIGH and CRITICAL, do NOT set exit-code here
          format: 'json'
          vuln-type: 'os,library'
          output: 'trivy-report.json'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy JSON report
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: error

      - name: Run Trivy vulnerability scan - Fail on CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # corresponds to v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: 'table'
          ignore-unfixed: true
          exit-code: '1'
          vuln-type: 'os,library'
          severity: 'CRITICAL'
