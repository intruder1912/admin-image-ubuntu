name: Trivy Container Scan

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  trivy-scan:
    name: Trivy Scan
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Check if Dockerfile exists
        run: |
          if [ ! -f Dockerfile ]; then
            echo "ERROR: Dockerfile not found in repository root."
            exit 1
          fi
      
      - name: Build an image from Dockerfile
        run: docker build -t ${{ env.IMAGE_NAME }} .
      
      - name: Run Trivy vulnerability scan - Full report (but no CI fail)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # corresponds to v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          # produce a machine-readable report including HIGH and CRITICAL, do NOT set exit-code here
          format: 'json'
          vuln-type: 'os,library'
          output: 'trivy-report.json'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy JSON report
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: error

      - name: Run Trivy vulnerability scan - Fail on CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # corresponds to v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: 'table'
          ignore-unfixed: true
          exit-code: '1'
          vuln-type: 'os,library'
          severity: 'CRITICAL'
