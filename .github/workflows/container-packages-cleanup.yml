name: Cleanup Old Container Package Versions

on:
  schedule:
    - cron: '19 3 * * 0'  # Every Sunday at 03:19 UTC
  workflow_dispatch:      # Optional manual trigger

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Delete old container package versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: 'container'  # or 'npm', 'maven', etc.
          # one published build is 11 package "versions" (image index, per-platform manifests,
          # attestations, signatures), so keep the two newest builds (latest + the one before)
          # and let a run delete up to 5 old builds; the action default of 1 version per run
          # never caught up with the number of versions a build creates
          min-versions-to-keep: 22
          num-old-versions-to-delete: 55
          token: ${{ secrets.GITHUB_TOKEN }}
