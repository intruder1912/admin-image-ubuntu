# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

# Dependabot update jobs may only reach allowlisted hosts. the Dockerfile pulls the
# kubectl binary from registry.k8s.io, which is not on that list unless it is
# declared here (even though it allows anonymous pulls); without this the docker
# update job fails with "private_source_authentication_failure"
registries:
  k8s-registry:
    type: docker-registry
    url: https://registry.k8s.io

updates:
  - package-ecosystem: "docker" # See documentation for possible values
    directory: "/" # Location of package manifests
    registries:
      - k8s-registry
    schedule:
      interval: "weekly"
    # wait before proposing brand-new releases (guards against compromised
    # releases that get yanked); security updates are not delayed by this
    cooldown:
      default-days: 7

  # tools/aws-cdk/package.json pins the aws-cdk version the Dockerfile installs
  - package-ecosystem: "npm"
    directory: "/tools/aws-cdk"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
